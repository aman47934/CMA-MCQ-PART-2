<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMA Part 2 Exam Practice Portal</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #1976d2;
      --primary-dark: #115293;
      --success: #2e7d32;
      --danger: #d32f2f;
      --mark-blue: #1565c0;
      --unanswered: #334155;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: #1e293b; min-height: 100vh; }
    .container { max-width: 1150px; margin: auto; padding: 20px; }
    .page { display: none; }
    .page.active { display: block; }

    .card { background: white; border-radius: 12px; padding: 32px; border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,0.06); }

    .author-badge {
      display: inline-block;
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .radio-pills { display: flex; gap: 15px; margin: 10px 0 22px; }
    .pill { flex: 1; border: 2px solid var(--border); padding: 14px; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .pill.selected { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    
    .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 20px; }
    @media(max-width: 768px){ .section-grid { grid-template-columns: 1fr; } }
    .sec-card { border: 2px solid var(--border); border-radius: 8px; padding: 14px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
    .sec-card.selected { border-color: var(--primary); background: #eff6ff; }
    .sec-card input { transform: scale(1.3); cursor: pointer; }
    .sec-info { font-weight: 600; font-size: 0.95rem; }
    .sec-count { font-size: 0.85rem; color: #64748b; font-weight: 500; margin-top: 3px; }

    .input-box { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; margin: 8px 0 20px; font-size: 1rem; }

    /* Top Bar & Section Header Tabs */
    .header-bar { background: #1e293b; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    
    .section-tabs-bar {
      display: flex;
      gap: 10px;
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 15px;
      overflow-x: auto;
    }
    .sec-tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--border);
      background: white;
      border-radius: 6px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sec-tab-btn:hover { background: #f1f5f9; }
    .sec-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .grid-view { display: grid; grid-template-columns: 1fr 310px; gap: 20px; margin-top: 15px; }
    @media(max-width: 850px){ .grid-view { grid-template-columns: 1fr; } }
    .q-box { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 24px; min-height: 490px; display: flex; flex-direction: column; }
    
    .q-text { 
      font-size: 1.15rem; 
      font-weight: 600; 
      line-height: 1.7; 
      margin-bottom: 22px; 
      white-space: pre-wrap; 
      word-break: break-word;
    }

    .table-responsive { width: 100%; overflow-x: auto; margin: 16px 0; }
    .mcq-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 0.98rem; background: #ffffff; white-space: normal; }
    .mcq-table th, .mcq-table td { border: 1px solid #cbd5e1; padding: 10px 14px; text-align: left; }
    .mcq-table th { background: #f1f5f9; color: #0f172a; font-weight: 700; }
    .mcq-table tr:nth-child(even) { background: #f8fafc; }

    .opt-container { margin-bottom: 12px; }
    .opt-item { border: 2px solid var(--border); border-radius: 8px; padding: 14px 18px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; font-size: 1.02rem; line-height: 1.5; background: #fafafa; }
    .opt-item:hover { background: #f1f5f9; }
    .opt-item.selected { border-color: var(--primary); background: #eff6ff; }
    
    .opt-item.correct { border-color: var(--success) !important; background: #dcfce7 !important; color: #166534 !important; font-weight: 600; }
    .opt-item.wrong { border-color: var(--danger) !important; background: #fee2e2 !important; color: #991b1b !important; font-weight: 600; }

    .explanation-card { background: #f8fafc; border-left: 4px solid var(--primary); padding: 16px; border-radius: 6px; margin-top: 15px; display: none; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; }

    .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-height: 380px; overflow-y: auto; margin-top: 15px; }
    .pal-btn { aspect-ratio: 1; border: none; border-radius: 6px; color: white; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
    .pal-btn.green { background: var(--success); }
    .pal-btn.blue { background: var(--mark-blue); }
    .pal-btn.black { background: var(--unanswered); }
    .pal-btn.active { outline: 3px solid #f59e0b; }

    .btn { padding: 11px 22px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-mark { background: #e0e7ff; color: var(--mark-blue); }
  </style>

  <script src="questions.js"></script>
</head>
<body>

  <!-- PAGE 1: Configuration -->
  <div id="page-config" class="page active">
    <div class="container" style="max-width: 680px; margin-top: 30px;">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 20px;">
          <h2>Create a Test</h2>
          <span class="author-badge"><i class="fa-solid fa-user-check"></i> Prepared by Mr. Aman Gupta</span>
        </div>
        
        <label style="font-weight: 600;">Select Mode</label>
        <div class="radio-pills">
          <div id="optModeExam" class="pill selected" onclick="selectMode('exam')">EXAM MODE</div>
          <div id="optModePractice" class="pill" onclick="selectMode('practice')">PRACTICE MODE</div>
        </div>

        <label style="font-weight: 600;">Select Section(s) (All Questions Included)</label>
        <div class="section-grid" id="sectionGrid"></div>

        <label style="font-weight: 600;">Timer Settings</label>
        <div class="radio-pills">
          <div id="optTimerSet" class="pill selected" onclick="toggleTimerOption(true)">SET TIME</div>
          <div id="optTimerNone" class="pill" onclick="toggleTimerOption(false)">NO TIME</div>
        </div>

        <div id="timeSettingInputs">
          <label style="font-size: 0.95rem; font-weight: 600;">Give Time Setting (Hours & Minutes)</label>
          <div style="display: flex; gap: 12px; margin-top: 8px;">
            <input type="number" id="timeHours" class="input-box" placeholder="Hours" value="1" min="0" />
            <input type="number" id="timeMinutes" class="input-box" placeholder="Minutes" value="0" min="0" />
          </div>
        </div>

        <button class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1.05rem;" onclick="startConfiguredExam()">Start Test</button>
        
        <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: #94a3b8;">
          Made by <strong>Mr. Aman Gupta</strong>
        </div>
      </div>
    </div>
  </div>

  <!-- PAGE 2: Exam Area -->
  <div id="page-exam" class="page">
    <div class="header-bar">
      <div>
        <h3 id="modeTitle">CMA Part 2 Exam</h3>
        <span style="font-size: 0.8rem; color: #cbd5e1;">Portal by Mr. Aman Gupta</span>
      </div>
      <div style="font-weight: 700; font-size: 1.15rem; color: #38bdf8;">
        <i class="fa-regular fa-clock"></i> <span id="timerBox">00H : 00M</span>
      </div>
    </div>

    <div class="container">
      <div class="section-tabs-bar" id="sectionTabsBar"></div>

      <div class="grid-view">
        <div class="q-box">
          <div id="qPrompt" class="q-text">Loading question...</div>
          <div id="optionsWrap"></div>
          <div id="explanationWrap" class="explanation-card"></div>

          <div style="margin-top: auto; display: flex; gap: 10px; padding-top: 20px; border-top: 1px solid var(--border);">
            <button class="btn btn-secondary" onclick="stepQuestion(-1)"><i class="fa-solid fa-arrow-left"></i> BACK</button>
            <button class="btn btn-mark" onclick="markForLater()"><i class="fa-regular fa-bookmark"></i> MARK</button>
            <button class="btn btn-secondary" onclick="skipQuestion()"><i class="fa-solid fa-forward"></i> SKIP</button>
            <button class="btn btn-primary" style="margin-left: auto;" onclick="submitAndNext()">SUBMIT & NEXT <i class="fa-solid fa-arrow-right"></i></button>
          </div>
        </div>

        <div class="card" style="padding: 20px; height: fit-content;">
          <h4 id="paletteHeader">REVIEW PALETTE</h4>
          <div style="display: flex; gap: 12px; margin-top: 10px; font-size: 0.85rem; font-weight: 500;">
            <div><span style="display:inline-block;width:12px;height:12px;background:var(--success);border-radius:50%;"></span> Answered</div>
            <div><span style="display:inline-block;width:12px;height:12px;background:var(--unanswered);border-radius:50%;"></span> Skipped</div>
            <div><span style="display:inline-block;width:12px;height:12px;background:var(--mark-blue);border-radius:50%;"></span> Marked</div>
          </div>
          <div class="palette" id="paletteGrid"></div>
          <button class="btn btn-primary" style="width: 100%; margin-top: 20px; background: #e11d48;" onclick="submitExam()">Finish Test</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PAGE 3: Final Marks -->
  <div id="page-result" class="page">
    <div class="container" style="max-width: 600px; text-align: center; margin-top: 50px;">
      <div class="card">
        <h2 style="color: #64748b; letter-spacing: 1px;">MARKS</h2>
        <div style="font-size: 2.8rem; font-weight: 800; margin: 20px 0; color: #0284c7; border: 3px solid #0284c7; border-radius: 50px; display: inline-block; padding: 10px 40px;" id="scoreSummary">0/0</div>
        <div style="font-size: 2.2rem; font-weight: 800; color: var(--success); margin-bottom: 25px;" id="percentSummary">0%</div>
        <button class="btn btn-primary" onclick="toggleResultModal()"><i class="fa-regular fa-eye"></i> VIEW RESULT</button>
        <div id="resultDetails" style="display: none; text-align: left; margin-top: 25px;"></div>
      </div>
    </div>
  </div>

  <script>
    let activeQuestions = [];
    let currentQ = 0;
    let userState = {};
    let activeMode = 'exam';
    let hasTimerLimit = true;
    let timerRemaining = 0;
    let timerRef = null;
    let selectedSectionsList = [];
    let activeSectionLetter = "";

    window.onload = function() {
      if (typeof CMA_SECTIONS_DB === 'undefined') {
        document.getElementById("sectionGrid").innerHTML = `
          <div style="grid-column: span 2; color: red; text-align: center; padding: 20px;">
            <strong>Error:</strong> <code>questions.js</code> file nahi mili.<br>
            Ensure karein ki <code>questions.js</code> aur <code>index.html</code> ek hi folder me hain.
          </div>`;
        return;
      }
      renderSectionSelector();
    };

    function renderSectionSelector() {
      const grid = document.getElementById("sectionGrid");
      grid.innerHTML = "";

      Object.keys(CMA_SECTIONS_DB).forEach((sec) => {
        const secObj = CMA_SECTIONS_DB[sec];
        const count = secObj.questions.length;
        const div = document.createElement("div");
        div.className = "sec-card" + (sec === "A" ? " selected" : "");
        div.id = `sec-card-${sec}`;
        div.onclick = (e) => {
          if (e.target.tagName !== 'INPUT') {
            const chk = document.getElementById(`chk-${sec}`);
            chk.checked = !chk.checked;
          }
          div.classList.toggle("selected", document.getElementById(`chk-${sec}`).checked);
        };

        div.innerHTML = `
          <input type="checkbox" id="chk-${sec}" ${sec === "A" ? "checked" : ""} />
          <div>
            <div class="sec-info">${secObj.title}</div>
            <div class="sec-count">${count} Questions (All included)</div>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function getSelectedSections() {
      return Object.keys(CMA_SECTIONS_DB).filter(sec => {
        const c = document.getElementById(`chk-${sec}`);
        return c && c.checked;
      });
    }

    function selectMode(m) {
      activeMode = m;
      document.getElementById('optModeExam').classList.toggle('selected', m === 'exam');
      document.getElementById('optModePractice').classList.toggle('selected', m === 'practice');
    }

    function toggleTimerOption(enabled) {
      hasTimerLimit = enabled;
      document.getElementById('optTimerSet').classList.toggle('selected', enabled);
      document.getElementById('optTimerNone').classList.toggle('selected', !enabled);
      document.getElementById('timeSettingInputs').style.display = enabled ? 'block' : 'none';
    }

    function startConfiguredExam() {
      selectedSectionsList = getSelectedSections();
      if (selectedSectionsList.length === 0) {
        alert("Kripya kam se kam ek Section select karein.");
        return;
      }

      let q_list = [];
      selectedSectionsList.forEach(sec => {
        const cloned = JSON.parse(JSON.stringify(CMA_SECTIONS_DB[sec].questions));
        cloned.forEach((q, idx) => {
          q.secLetter = sec;
          q.secIndex = idx + 1;
        });
        q_list.push(...cloned);
      });

      activeQuestions = q_list;
      userState = {};
      activeQuestions.forEach((_, i) => userState[i] = { selected: null, status: 'black' });
      currentQ = 0;
      activeSectionLetter = activeQuestions[0].secLetter;

      document.getElementById('modeTitle').innerText = activeMode === 'exam' ? 'Exam Mode' : 'Practice Mode';
      
      initTimer();
      renderSectionTabs();
      renderQuestion(0);
      switchPage('page-exam');
    }

    function renderSectionTabs() {
      const tabsBar = document.getElementById('sectionTabsBar');
      tabsBar.innerHTML = '';

      selectedSectionsList.forEach(sec => {
        const btn = document.createElement('button');
        btn.className = `sec-tab-btn ${sec === activeSectionLetter ? 'active' : ''}`;
        btn.id = `tab-sec-${sec}`;
        btn.innerHTML = `<i class="fa-solid fa-folder-open"></i> Section ${sec}`;
        btn.onclick = () => switchToSection(sec);
        tabsBar.appendChild(btn);
      });
    }

    function switchToSection(sec) {
      activeSectionLetter = sec;
      const firstQIndex = activeQuestions.findIndex(q => q.secLetter === sec);
      if (firstQIndex !== -1) {
        renderQuestion(firstQIndex);
      }
    }

    function updateSectionTabsHighlight() {
      selectedSectionsList.forEach(sec => {
        const btn = document.getElementById(`tab-sec-${sec}`);
        if (btn) {
          btn.classList.toggle('active', sec === activeSectionLetter);
        }
      });
    }

    function switchPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function initTimer() {
      if (timerRef) clearInterval(timerRef);
      if (hasTimerLimit) {
        const h = parseInt(document.getElementById('timeHours').value, 10) || 0;
        const m = parseInt(document.getElementById('timeMinutes').value, 10) || 0;
        timerRemaining = (h * 3600) + (m * 60);
        if (timerRemaining <= 0) timerRemaining = 3600;

        timerRef = setInterval(() => {
          timerRemaining--;
          updateTimerDisplay(timerRemaining);
          if (timerRemaining <= 0) {
            clearInterval(timerRef);
            alert("Samay samapt ho gaya hai! Test submit kiya ja raha hai.");
            submitExam();
          }
        }, 1000);
      } else {
        timerRemaining = 0;
        timerRef = setInterval(() => {
          timerRemaining++;
          updateTimerDisplay(timerRemaining);
        }, 1000);
      }
    }

    function updateTimerDisplay(s) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      document.getElementById('timerBox').innerText = `${String(h).padStart(2,'0')}H : ${String(m).padStart(2,'0')}M`;
    }

    // Palette ab sirf activeSectionLetter ke question numbers hi dynamically render karega
    function renderPalette() {
      const grid = document.getElementById('paletteGrid');
      grid.innerHTML = '';
      
      document.getElementById('paletteHeader').innerText = `SECTION ${activeSectionLetter} REVIEW`;

      activeQuestions.forEach((q, globalIdx) => {
        if (q.secLetter === activeSectionLetter) {
          const b = document.createElement('button');
          b.className = `pal-btn ${userState[globalIdx].status}`;
          b.id = `pal-${globalIdx}`;
          b.innerText = q.secIndex; // 1, 2, 3... us section ke hisaab se
          if (globalIdx === currentQ) b.classList.add('active');
          b.onclick = () => renderQuestion(globalIdx);
          grid.appendChild(b);
        }
      });
    }

    function renderQuestion(idx) {
      currentQ = idx;
      const data = activeQuestions[idx];

      // Section change check & palette update
      activeSectionLetter = data.secLetter;
      updateSectionTabsHighlight();
      renderPalette();

      document.getElementById('qPrompt').innerHTML = `MCQ ${data.secIndex} (Section ${data.secLetter}). ${data.questionText}`;

      const wrap = document.getElementById('optionsWrap');
      wrap.innerHTML = '';
      const expBox = document.getElementById('explanationWrap');
      expBox.style.display = 'none';

      ['A', 'B', 'C', 'D'].forEach(k => {
        if (!data.options[k]) return;
        
        const container = document.createElement('div');
        container.className = 'opt-container';

        const div = document.createElement('div');
        div.className = 'opt-item';
        div.id = `opt-${k}`;
        if (userState[idx].selected === k) div.classList.add('selected');

        div.innerHTML = `<strong>(${k})</strong> <span>${data.options[k]}</span>`;
        div.onclick = () => onSelectOption(k);

        container.appendChild(div);
        wrap.appendChild(container);
      });

      if (activeMode === 'practice' && userState[idx].selected) {
        showPracticeVisuals(userState[idx].selected);
      }
    }

    function onSelectOption(k) {
      userState[currentQ].selected = k;
      document.querySelectorAll('.opt-item').forEach(el => el.classList.remove('selected'));
      const item = document.getElementById(`opt-${k}`);
      if (item) item.classList.add('selected');

      if (activeMode === 'practice') {
        showPracticeVisuals(k);
      }
    }

    function showPracticeVisuals(chosen) {
      const q = activeQuestions[currentQ];
      ['A', 'B', 'C', 'D'].forEach(k => {
        const item = document.getElementById(`opt-${k}`);
        if (!item) return;

        item.classList.remove('correct', 'wrong');
        if (k === q.correct) {
          item.classList.add('correct');
        } else {
          item.classList.add('wrong');
        }
      });

      const exp = document.getElementById('explanationWrap');
      exp.style.display = 'block';
      exp.innerHTML = `
        <div style="font-weight: 700; margin-bottom: 6px;"><i class="fa-solid fa-circle-check"></i> Solution / Explanation:</div>
        <div>${q.explanation}</div>
      `;
    }

    function submitAndNext() {
      if (userState[currentQ].selected) {
        userState[currentQ].status = 'green';
      }
      updatePaletteItem(currentQ);
      if (currentQ < activeQuestions.length - 1) renderQuestion(currentQ + 1);
      else if (confirm("Test submit karein?")) submitExam();
    }

    function skipQuestion() {
      userState[currentQ].status = 'black';
      updatePaletteItem(currentQ);
      if (currentQ < activeQuestions.length - 1) renderQuestion(currentQ + 1);
    }

    function markForLater() {
      userState[currentQ].status = 'blue';
      updatePaletteItem(currentQ);
      if (currentQ < activeQuestions.length - 1) renderQuestion(currentQ + 1);
    }

    function stepQuestion(dir) {
      if (currentQ + dir >= 0 && currentQ + dir < activeQuestions.length) {
        renderQuestion(currentQ + dir);
      }
    }

    function updatePaletteItem(i) {
      const b = document.getElementById(`pal-${i}`);
      if (b) {
        b.className = `pal-btn ${userState[i].status}`;
      }
    }

    function submitExam() {
      if (timerRef) clearInterval(timerRef);
      let correct = 0;
      activeQuestions.forEach((q, i) => {
        if (userState[i].selected === q.correct) correct++;
      });
      const pct = Math.round((correct / activeQuestions.length) * 100);
      document.getElementById('scoreSummary').innerText = `${correct}/${activeQuestions.length}`;
      document.getElementById('percentSummary').innerText = `${pct}%`;
      switchPage('page-result');
    }

    function toggleResultModal() {
      const box = document.getElementById('resultDetails');
      if (box.style.display === 'block') { box.style.display = 'none'; return; }

      box.innerHTML = '';
      activeQuestions.forEach((q, i) => {
        const sel = userState[i].selected;
        const isRight = sel === q.correct;
        const div = document.createElement('div');
        div.style.cssText = "background: #f8fafc; border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 12px;";
        div.innerHTML = `
          <div style="font-weight: 700; margin-bottom: 6px;">Q${q.secIndex} (Section ${q.secLetter}). ${q.questionText}</div>
          <div style="color: ${isRight ? 'var(--success)' : 'var(--danger)'}; font-weight: 600;">Your Choice: ${sel || 'Skipped'}</div>
          <div style="color: var(--success); font-weight: 600;">Correct Choice: ${q.correct}</div>
          <div style="font-size: 0.9rem; margin-top: 6px; color: #475569; white-space: pre-wrap;">${q.explanation}</div>
        `;
        box.appendChild(div);
      });
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
